<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Capstone Project</title>
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <main class="settings-page">
    <header class="settings-header">
      <h1>Account Settings</h1>
      <p class="settings-subtitle">Update your profile and preferences.</p>
    </header>

    <form id="settings-form" class="settings-form" novalidate>
      <section class="form-section" aria-labelledby="profile-heading">
        <h2 id="profile-heading">Profile</h2>

        <div class="form-field">
          <label for="full-name">Full name <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="full-name"
            name="fullName"
            autocomplete="name"
            required
            minlength="2"
            maxlength="50"
            aria-describedby="full-name-error"
          >
          <p id="full-name-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          >
          <p id="email-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="username">Username <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
            minlength="3"
            maxlength="20"
            pattern="[a-zA-Z0-9_]+"
            aria-describedby="username-hint username-error"
          >
          <p id="username-hint" class="field-hint">3–20 characters. Letters, numbers, and underscores only.</p>
          <p id="username-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="phone">Phone number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            placeholder="e.g. +1 555 123 4567"
            aria-describedby="phone-error"
          >
          <p id="phone-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="bio">Bio</label>
          <textarea
            id="bio"
            name="bio"
            rows="4"
            maxlength="500"
            aria-describedby="bio-hint bio-error"
          ></textarea>
          <p id="bio-hint" class="field-hint"><span id="bio-count">0</span> / 500 characters</p>
          <p id="bio-error" class="field-error" role="alert" hidden></p>
        </div>
      </section>

      <section class="form-section" aria-labelledby="security-heading">
        <h2 id="security-heading">Security</h2>

        <div class="form-field">
          <label for="password">New password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            aria-describedby="password-hint password-error"
          >
          <p id="password-hint" class="field-hint">Leave blank to keep your current password. At least 8 characters with uppercase, lowercase, and a number.</p>
          <p id="password-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="confirm-password">Confirm new password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            aria-describedby="confirm-password-error"
          >
          <p id="confirm-password-error" class="field-error" role="alert" hidden></p>
        </div>
      </section>

      <section class="form-section" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading">Preferences</h2>

        <div class="form-field">
          <label for="theme">Theme</label>
          <select id="theme" name="theme" aria-describedby="theme-error">
            <option value="system">System default</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <p id="theme-error" class="field-error" role="alert" hidden></p>
        </div>

        <div class="form-field">
          <label for="language">Language</label>
          <select id="language" name="language" aria-describedby="language-error">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
          </select>
          <p id="language-error" class="field-error" role="alert" hidden></p>
        </div>

        <fieldset class="form-field checkbox-group">
          <legend>Notifications</legend>
          <label class="checkbox-label">
            <input type="checkbox" id="email-notifications" name="emailNotifications" checked>
            Email notifications
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="product-updates" name="productUpdates">
            Product updates
          </label>
        </fieldset>
      </section>

      <section class="form-section" aria-labelledby="consent-heading">
        <div class="form-field">
          <label class="checkbox-label consent-label">
            <input
              type="checkbox"
              id="terms"
              name="terms"
              required
              aria-describedby="terms-error"
            >
            I agree to the terms of service and privacy policy
            <span class="required" aria-hidden="true">*</span>
          </label>
          <p id="terms-error" class="field-error" role="alert" hidden></p>
        </div>
      </section>

      <div id="form-status" class="form-status" role="status" aria-live="polite" hidden></div>

      <div class="form-actions">
        <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
        <button type="submit" class="btn btn-primary">Save settings</button>
      </div>
    </form>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/settings-form.js"></script>
</body>
</html>
