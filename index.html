<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Capstone Project</title>
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <main class="settings-page">
      <section class="settings-card" aria-labelledby="settings-heading">
        <header class="settings-header">
          <h1 id="settings-heading">Account Settings</h1>
          <p class="settings-intro">Update your profile and preferences.</p>
        </header>

        <div
          id="form-success"
          class="form-message form-message--success"
          role="status"
          hidden
        ></div>

        <form id="settings-form" class="settings-form" novalidate>
          <fieldset class="form-section">
            <legend>Profile</legend>

            <div class="form-field" data-field="fullName">
              <label for="full-name">Full name</label>
              <input
                id="full-name"
                name="fullName"
                type="text"
                autocomplete="name"
                required
                aria-describedby="full-name-error"
              />
              <p id="full-name-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field" data-field="email">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="email-error"
              />
              <p id="email-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field" data-field="username">
              <label for="username">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                aria-describedby="username-error"
              />
              <p id="username-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field" data-field="phone">
              <label for="phone">Phone <span class="optional">(optional)</span></label>
              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="+1 (555) 123-4567"
                aria-describedby="phone-error"
              />
              <p id="phone-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field" data-field="bio">
              <label for="bio">Bio <span class="optional">(optional)</span></label>
              <textarea
                id="bio"
                name="bio"
                rows="4"
                maxlength="500"
                aria-describedby="bio-counter bio-error"
              ></textarea>
              <p id="bio-counter" class="char-counter" aria-live="polite">0 / 500</p>
              <p id="bio-error" class="field-error" role="alert"></p>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend>Security</legend>

            <div class="form-field" data-field="password">
              <label for="password">New password <span class="optional">(optional)</span></label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                aria-describedby="password-error"
              />
              <p id="password-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field" data-field="confirmPassword">
              <label for="confirm-password">Confirm password</label>
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                aria-describedby="confirm-password-error"
              />
              <p id="confirm-password-error" class="field-error" role="alert"></p>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend>Preferences</legend>

            <div class="form-field" data-field="theme">
              <label for="theme">Theme</label>
              <select id="theme" name="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system" selected>System</option>
              </select>
            </div>

            <div class="form-field" data-field="language">
              <label for="language">Language</label>
              <select id="language" name="language">
                <option value="en" selected>English</option>
                <option value="hi">Hindi</option>
              </select>
            </div>
          </fieldset>

          <div class="form-field form-field--checkbox" data-field="terms">
            <input id="terms" name="terms" type="checkbox" required />
            <label for="terms">I agree to the terms and conditions</label>
            <p id="terms-error" class="field-error" role="alert"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Save settings</button>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="js/settings-form.js"></script>
  </body>
</html>
